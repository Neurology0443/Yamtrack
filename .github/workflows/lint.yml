name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github src

      - name: Ruff format
        run: uv run --no-sync ruff format --check src

      - name: djLint check
        run: uv run --no-sync djlint --lint src/templates

      - name: djLint format
        run: uv run --no-sync djlint --check src/templates
