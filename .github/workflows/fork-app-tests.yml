name: Fork App Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            postgres_image: ""
            db_host: ""
          - database: postgresql
            postgres_image: postgres:17-alpine
            db_host: 127.0.0.1
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: yamtrack
          POSTGRES_USER: yamtrack
          POSTGRES_PASSWORD: yamtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yamtrack -d yamtrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: ${{ matrix.db_host }}
      DB_NAME: yamtrack
      DB_USER: yamtrack
      DB_PASSWORD: yamtrack
      DB_PORT: "5432"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv sync --locked --no-default-groups --group test
          uv run --no-sync playwright install chromium

      - name: Set environment variables from secrets
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> $GITHUB_ENV; fi

      - name: Run Tests
        run: |
          uv run --no-sync python src/manage.py check
          uv run --no-sync python src/manage.py makemigrations --check
          uv run --no-sync coverage run src/manage.py test \
            app anime users integrations lists events \
            --exclude-tag=live_provider \
            --parallel

      - name: Build Coverage Report
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage report

  provider-live:
    name: Provider Live Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Set environment variables from secrets
        run: |
          if [ -n "${{ secrets.SECRET }}" ]; then echo "SECRET=${{ secrets.SECRET }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.TMDB_API }}" ]; then echo "TMDB_API=${{ secrets.TMDB_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.MAL_API }}" ]; then echo "MAL_API=${{ secrets.MAL_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_ID }}" ]; then echo "IGDB_ID=${{ secrets.IGDB_ID }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.IGDB_SECRET }}" ]; then echo "IGDB_SECRET=${{ secrets.IGDB_SECRET }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.HARDCOVER_API }}" ]; then echo "HARDCOVER_API=${{ secrets.HARDCOVER_API }}" >> $GITHUB_ENV; fi
          if [ -n "${{ secrets.COMICVINE_API }}" ]; then echo "COMICVINE_API=${{ secrets.COMICVINE_API }}" >> $GITHUB_ENV; fi

      - name: Run live provider tests
        run: |
          uv run --no-sync python src/manage.py test \
            app.tests.providers.test_metadata \
            app.tests.providers.test_search \
            --tag=live_provider
