name: Docker Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image (main or v* refs only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set test version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: yamtrack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}

      - name: Start container
        run: |
          docker network create yamtrack-test
          docker run -d --name yamtrack-redis --network yamtrack-test redis:8-alpine
          docker run -d --name yamtrack --network yamtrack-test \
            -e TZ=UTC \
            -e SECRET=github-actions-testing-secret \
            -e REDIS_URL=redis://yamtrack-redis:6379 \
            -p 8000:8000 \
            yamtrack:test

      - name: Wait for container to become healthy
        run: |
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' yamtrack)
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' yamtrack)" != "true" ]; then
              echo "::error::Container exited before becoming healthy"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Container did not become healthy in time"
          exit 1

      - name: Check health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health/

      - name: Check login page is served
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/accounts/login/ \
            | grep -q "Yamtrack"

      - name: Check static files are served
        run: |
          curl --fail --silent --show-error --output /dev/null \
            http://127.0.0.1:8000/static/css/main.css

      - name: Check version was baked into the image
        run: test "$(docker exec yamtrack printenv VERSION)" = "${{ steps.version.outputs.value }}"

      - name: Dump container logs
        if: failure()
        run: |
          docker logs yamtrack
          docker logs yamtrack-redis

  publish:
    needs: test
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
